name: Deploy to Cloud Run

on:
  push:
    branches:
      - main  # Ganti ke 'master' jika branch utama Anda master

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: "asia-southeast1"
  SERVICE_NAME: "genstlap"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 1. Konfigurasi Docker agar bisa push ke Google Container Registry (GCR)
      - name: Configure Docker
        run: gcloud auth configure-docker gcr.io --quiet

      # 2. Build image Docker secara lokal di GitHub Actions
      - name: Build Docker Image
        run: docker build -t gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .

      # 3. Push image Docker ke Google Container Registry
      - name: Push Docker Image
        run: docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      # 4. Deploy image yang sudah ada ke Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated'
