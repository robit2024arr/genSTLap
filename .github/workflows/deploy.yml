name: Deploy to Cloud Run

on:
  push:
    branches:
      - main  # Ganti ke 'master' jika branch utama Anda master

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: "asia-southeast1"
  SERVICE_NAME: "genstlap"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Google Cloud Run action dapat otomatis melakukan build & push (menggunakan Cloud Build) 
      # atau Anda bisa langsung deploy dari source code tanpa repot konfigurasi manual docker push.
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          source: ./  # Melakukan deploy langsung dari source code repository
          flags: '--allow-unauthenticated'
